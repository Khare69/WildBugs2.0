<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#2d6a4f" stroke-width="2.5" opacity="0.6"/>

  <!-- Glowing outer ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#52b788" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Insect Icon Graphics -->
  <g transform="translate(96, 96)">
    <!-- Antennae -->
    <path d="M-12 -38 Q-28 -62 -44 -56" fill="none" stroke="#74c69d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-44" cy="-56" r="3.5" fill="#95d5b2"/>
    <path d="M12 -38 Q28 -62 44 -56" fill="none" stroke="#74c69d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="-56" r="3.5" fill="#95d5b2"/>

    <!-- Legs Left -->
    <path d="M-22 -14 Q-50 -24 -56 -10" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>
    <path d="M-28 6 Q-56 6 -60 22" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>
    <path d="M-24 26 Q-52 38 -54 54" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>

    <!-- Legs Right -->
    <path d="M22 -14 Q50 -24 56 -10" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 6 Q56 6 60 22" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 26 Q52 38 54 54" fill="none" stroke="#40916c" stroke-width="3" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="0" cy="-34" r="14" fill="#52b788" filter="url(#glow)"/>
    <circle cx="-6" cy="-36" r="3" fill="#d8f3dc"/>
    <circle cx="6" cy="-36" r="3" fill="#d8f3dc"/>

    <!-- Thorax -->
    <ellipse cx="0" cy="-14" rx="18" ry="12" fill="url(#emeraldGrad)"/>

    <!-- Elytra / Abdomen Wings -->
    <path d="M-2 -2 Q-36 18 -26 48 Q-12 60 -1 64 Z" fill="url(#emeraldGrad)" stroke="#74c69d" stroke-width="1.5"/>
    <path d="M2 -2 Q36 18 26 48 Q12 60 1 64 Z" fill="url(#emeraldGrad)" stroke="#74c69d" stroke-width="1.5"/>

    <!-- Wing accent dots -->
    <circle cx="-14" cy="24" r="2.5" fill="#95d5b2" opacity="0.8"/>
    <circle cx="-10" cy="40" r="2" fill="#95d5b2" opacity="0.8"/>
    <circle cx="14" cy="24" r="2.5" fill="#95d5b2" opacity="0.8"/>
    <circle cx="10" cy="40" r="2" fill="#95d5b2" opacity="0.8"/>
  </g>
</svg>
